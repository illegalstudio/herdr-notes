name: Check

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check mods/herdr-notes/main.js
      - run: node --test tests/test_plib.mjs tests/test_plib_cli.mjs
