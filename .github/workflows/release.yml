name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: |
          bash -n scripts/release.sh
          node --check mods/herdr-notes/main.js
          node --test tests/test_plib.mjs tests/test_plib_cli.mjs

      - name: Package the mod
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for format in zip tar.gz; do
            git archive --format="$format" --prefix=herdr-notes/ \
              --output="dist/herdr-notes_${version}.${format}" "$GITHUB_SHA" -- \
              mods/herdr-notes LICENSE README.md RECIPE.md preview.png
          done
          cd dist
          sha256sum -- *.zip *.tar.gz > "herdr-notes_${version}_checksums.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/*_checksums.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes
